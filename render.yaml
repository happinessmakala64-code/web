services:
  - type: web
    name: multivision-electronics
    plan: free
    runtime: node
    buildCommand: npm install --prefix api
    startCommand: node api/server.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_FILE_PATH
        value: api/data/products.json
