services:
  - type: web
    name: multivision-electronics
    runtime: node
    buildCommand: npm install --prefix api
    startCommand: node api/server.js
    envVars:
      - key: ADMIN_PASSWORD
        value: admin123
      - key: FRONTEND_ORIGIN
        value: "*"
    disk:
      name: catalogue-data
      mountPath: /opt/render/project/src/api/data
      sizeGB: 1