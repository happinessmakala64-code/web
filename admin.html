<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue admin | Multivision Electronics</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">
  <div class="announcement"><span class="status-dot"></span> Catalogue management</div>
  <header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">M<span>V</span></span><span><strong>MULTIVISION</strong><small>ELECTRONICS &amp; INVESTMENTS</small></span></a><a class="text-link" href="index.html">View website ↗</a></div></header>
  <main class="admin-main"><div class="container admin-layout">
    <section class="admin-intro"><p class="eyebrow">PRIVATE CATALOGUE AREA</p><h1>Keep your<br><em>shop current.</em></h1><p>Add, update or remove products here. Changes appear immediately and are saved permanently.</p></section>
    <section class="admin-panel" aria-labelledby="admin-title">
      <div class="admin-panel-heading"><div><p class="eyebrow">PRODUCTS</p><h2 id="admin-title">Manage catalogue</h2></div><button id="logout-button" class="clear-button" type="button" hidden>Sign out</button></div>
      <form id="login-form" class="admin-form"><label>Admin password<input id="admin-password" type="password" autocomplete="current-password" required></label><button class="button button-primary" type="submit">Enter catalogue</button><p id="login-message" class="form-message" role="alert"></p></form>
      <div id="catalogue-manager" hidden><form id="product-form" class="admin-form"><input id="product-id" type="hidden"><div class="form-grid"><label>Product name<input id="product-name" required></label><label>Category<input id="product-category" list="category-options" required><datalist id="category-options"><option>Laptops</option><option>Smartphones</option><option>Accessories</option><option>Home Electronics</option></datalist></label><label>Price in MWK<input id="product-price" type="number" min="0" required></label><label>Availability<select id="product-availability"><option>Available</option><option>Limited stock</option><option>Out of stock</option><option>Contact us</option></select></label></div><label>Description<textarea id="product-description" rows="3" required></textarea><div class="form-grid"><label>Product photo<input id="product-image-file" type="file" accept="image/*"><small>Use a small JPG or PNG so the catalogue stays fast.</small></label><label>Or image URL<input id="product-image-url" type="url" placeholder="https://..."><small>A hosted image URL also works.</small></label></div><label>Specifications <small>One item per line, for example: Memory: 8GB RAM</small><textarea id="product-specifications" rows="4" placeholder="Display: 6.5 inch&#10;Storage: 128GB"></textarea><div class="button-row"><button class="button button-primary" type="submit" id="save-product">Add product</button><button class="button button-ghost" type="button" id="cancel-edit" hidden>Cancel edit</button></div><p id="form-message" class="form-message" role="status"></p></form><div id="admin-products" class="admin-products"></div></div>
    </section>
  </div></main>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/admin.js"></script>
</body>
</html>
